name: CI - Run Pytest & Generate Allure Report

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # 步骤1：拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2：配置Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 步骤3：缓存依赖（提速）
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 步骤4：安装所有测试依赖（读取requirements.txt）
      - name: Install all test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 如需Playwright驱动，保留以下两行；无需则删除
          playwright install chromium
          playwright install-deps
        shell: pwsh

      # 步骤5：运行Pytest（恢复全量扫描，仅保留基础缓存清理）
      - name: Run pytest and generate Allure results
        run: |
          # 1. 强制创建allure-results目录
          New-Item -ItemType Directory -Path allure-results -Force
          
          # 2. 基础缓存清理（仅清理残留pyc文件，无需递归删除__pycache__）
          Write-Host "Cleaning up residual .pyc files..."
          Get-ChildItem -Path . -Recurse -Filter "*.pyc" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          
          # 3. 全量执行pytest（无目录限制，依赖pytest.ini的收集规则）
          try {
            Write-Host "Running full pytest suite with Allure report..."
            pytest --cache-clear `
                   --alluredir=allure-results `
                   -v
          } catch {
            Write-Warning "Pytest execution had errors: $_"
            exit 0
          }
        shell: pwsh

      # 步骤6：上传Allure结果
      - name: Upload Allure results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14