name: CI - Run Pytest & Generate Allure Report

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # 步骤1：拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2：配置Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 步骤3：缓存依赖（提速）
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 步骤4：安装所有测试依赖（读取requirements.txt）
      - name: Install all test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 补充Playwright驱动安装（如果用到）
          playwright install chromium
          playwright install-deps
        shell: pwsh

      # 步骤5：运行Pytest（含临时修复：清除缓存+解决命名冲突）
      - name: Run pytest and generate Allure results
        run: |
          # 1. 强制创建allure-results目录（避免执行失败时目录缺失）
          New-Item -ItemType Directory -Path allure-results -Force
          
          # 2. 临时修复：删除__pycache__和.pyc编译文件（解决命名冲突）
          Write-Host "Cleaning up __pycache__ and .pyc files..."
          Get-ChildItem -Path . -Recurse -Directory -Name "__pycache__" -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Recurse -Filter "*.pyc" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          
          # 3. 执行pytest，添加缓存清理+忽略缓存目录参数
          try {
            Write-Host "Running pytest with cache clear and conflict fixes..."
            pytest --cache-clear `
                   --ignore=__pycache__ `
                   --alluredir=allure-results `
                   -v
          } catch {
            Write-Warning "Pytest execution had errors: $_"
            # 测试失败仍返回0，保证后续步骤执行
            exit 0
          }
        shell: pwsh

      # 步骤6：上传Allure结果（无论测试成功/失败都上传）
      - name: Upload Allure results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14