name: CI - Run Pytest & Generate Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest  # 匹配本地Windows环境，避免系统差异

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 精简后的依赖安装步骤（无冗余if、语法绝对正确）
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "requirements.txt不存在，跳过批量安装"
          # 兜底安装核心包，避免依赖缺失（版本号按需调整）
          pip install pytest>=7.4.0 allure-pytest>=2.13.2 selenium>=4.15.0 Appium-Python-Client>=2.11.0 requests>=2.31.0

      # 可选：如需移动端测试，取消下面注释（已精简语法）
      # - name: Install Appium (for mobile tests)
      #   run: |
      #     npm install -g appium
      #     appium driver install uiautomator2

      # 精简测试运行逻辑（Windows cmd语法，无冗余）
      - name: Run all tests with pytest
        run: |
          if exist run_tests.py (python run_tests.py) else (pytest -v --alluredir=allure-results)

      # 上传Allure报告（核心兜底步骤，语法无错）
      - name: Upload Allure results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

