name: CI - Run Pytest & Generate Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          } else {
            Write-Output "requirements.txt not found, skipping bulk install"
          }
          # 兜底安装核心依赖（防止个别包缺失）
          pip install pytest>=7.4.0 allure-pytest>=2.13.2 selenium>=4.15.0 Appium-Python-Client>=2.11.0 requests>=2.31.0

      # 可选：Appium 安装（如果 mobile 测试需要，windows-latest 支持 npm）
      # - name: Install Appium (optional for mobile)
      #   run: |
      #     npm install -g appium
      #     appium driver install uiautomator2

      - name: Run all tests with pytest
        run: |
          if (Test-Path run_tests.py) {
            python run_tests.py
          } else {
            pytest -v --alluredir=allure-results
          }

      - name: Upload Allure results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14