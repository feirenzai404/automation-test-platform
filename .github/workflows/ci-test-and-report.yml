name: CI - Run Pytest & Generate Allure Report

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # 步骤1：拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2：配置Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 步骤3：安装依赖（极简版，无复杂判断）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest>=7.4.0 allure-pytest>=2.13.2
        shell: pwsh

      # 步骤4：运行Pytest（彻底移除run_tests.py生成逻辑，避免语法错误）
      - name: Run pytest directly
        run: |
          # 直接执行pytest，不依赖任何自定义脚本
          pytest --alluredir=allure-results -v
        shell: pwsh

      # 步骤5：上传Allure结果
      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14