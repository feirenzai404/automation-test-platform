name: CI - Run Pytest & Generate Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest  # 你的本地是 Windows，用 windows-latest 最接近

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if exist requirements.txt (pip install -r requirements.txt)

    # 可选：如果你的项目需要安装 Appium 或其他驱动（目前先跳过 mobile 环境）
    # - name: Install Appium (for mobile tests)
    #   run: npm install -g appium && appium driver install uiautomator2

    - name: Run all tests with pytest
      run: |
        # 如果你有 run_tests.py，就用它；否则直接跑 pytest
        if exist run_tests.py (
          python run_tests.py
        ) else (
          pytest -v --alluredir=allure-results
        )

    - name: Upload Allure results as artifact
      if: always()  # 即使测试失败也上传报告
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 14
   - name: 安装测试依赖
  run: |
    pip install --upgrade pip
    pip install -r requirements.txt

# 替换后（确保语法绝对正确）
- name: 安装测试依赖
  run: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    # 额外保障：手动安装核心包，避免requirements.txt解析问题
    pip install pytest>=7.4.0 allure-pytest>=2.13.2 selenium>=4.15.0 Appium-Python-Client>=2.11.0 requests>=2.31.0

