name: CI - Run Pytest & Generate Allure Report

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # 步骤1：拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2：配置Python 3.10
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 步骤3：缓存依赖（提速）
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 步骤4：安装所有必要依赖（包含selenium/appium）
      - name: Install all test dependencies
        run: |
          python -m pip install --upgrade pip
          # 安装测试所需的全部核心依赖
          pip install pytest>=7.4.0 allure-pytest>=2.13.2 selenium>=4.15.2 appium-python-client>=3.1.0
        shell: pwsh

      # 步骤5：运行Pytest（确保生成allure-results目录）
      - name: Run pytest and generate Allure results
        run: |
          # 创建allure-results目录（避免执行失败时目录缺失）
          New-Item -ItemType Directory -Path allure-results -Force
          # 执行pytest，即使失败也不中断（用try/finally保证目录存在）
          try {
            pytest --alluredir=allure-results -v
          } catch {
            Write-Warning "Pytest execution failed: $_"
            # 测试失败仍继续，保证后续步骤执行
            exit 0
          }
        shell: pwsh

      # 步骤6：上传Allure结果（确保路径存在）
      - name: Upload Allure results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14