name: CI - Run Pytest & Generate Allure Report

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install all test dependencies
        run: |  
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: pwsh

      
      - name: Run pytest and generate Allure results
        run: |
          
          New-Item -ItemType Directory -Path allure-results -Force
         
          try {
            pytest --alluredir=allure-results -v
          } catch {
            Write-Warning "Pytest execution had errors: $_"
          
            exit 0
          }
        shell: pwsh

      
      - name: Upload Allure results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14